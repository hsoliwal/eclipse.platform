name: Publish Unit Test Results

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
    check:
       # The called job requests these scopes; this fork's default GITHUB_TOKEN is read-only,
       # so without an explicit grant the run fails at startup.
       permissions:
         checks: write
         pull-requests: write
         contents: read
         issues: read
         actions: read
       uses: eclipse-platform/eclipse.platform.releng.aggregator/.github/workflows/publishTestResults.yml@master
