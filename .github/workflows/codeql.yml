name: CodeQL call

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '15 8 * * 1'

jobs:
  callCodeQLworkflow:
    # The called job requests these scopes; this fork's default GITHUB_TOKEN is read-only,
    # so without an explicit grant the run fails at startup.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: eclipse-platform/eclipse.platform.releng.aggregator/.github/workflows/codeQLworkflow.yml@master
